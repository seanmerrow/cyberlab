<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Records — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="dashboard-page">
  <header class="top-bar">
    <div class="top-bar-left">
      <svg class="header-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
      <h1>Patient Records</h1>
    </div>
    <div class="top-bar-right">
      <span id="username-display"></span>
      <button id="logout-btn" class="btn btn-outline">Sign Out</button>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search patients">
        <button type="button" id="search-clear" class="search-clear" hidden>&times;</button>
      </div>
      <div class="show-all-toggle">
        <label class="toggle-label" for="show-all-switch">
          <span>All Patients</span>
          <span class="toggle-switch">
            <input type="checkbox" id="show-all-switch">
            <span class="toggle-slider"></span>
          </span>
        </label>
      </div>
      <div id="patient-list" class="patient-list">
        <div class="search-prompt">Type to search for patients</div>
      </div>
    </aside>

    <main class="main-content">
      <div id="empty-state" class="empty-state">
        <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
        <h2>Select a Patient</h2>
        <p>Choose a patient from the list to view their records</p>
      </div>

      <div id="patient-detail" class="patient-detail" hidden>
        <div class="detail-header">
          <div class="patient-name-block">
            <h2 id="detail-name"></h2>
            <span id="detail-mrn" class="mrn-badge"></span>
          </div>
          <button id="close-detail" class="close-detail" title="Close record">&times;</button>
          <div id="detail-meta" class="detail-meta"></div>
        </div>

        <div class="tabs">
          <button class="tab active" data-tab="demographics">Demographics</button>
          <button class="tab" data-tab="encounters">Encounters</button>
          <button class="tab" data-tab="conditions">Medical History</button>
        </div>

        <div id="tab-demographics" class="tab-content active">
          <div id="demographics-grid" class="demographics-grid"></div>
        </div>

        <div id="tab-encounters" class="tab-content">
          <div id="encounters-content"></div>
        </div>

        <div id="tab-conditions" class="tab-content">
          <div id="conditions-content"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
